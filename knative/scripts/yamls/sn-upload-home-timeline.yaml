apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sn-upload-home-timeline
  namespace: knative-functions
spec:
  template:
    spec:
      containers:
        - image: docker.io/arearnest7/sn-upload-home-timeline:kn
          env:
          - name: SOCIAL_GRAPH_URL
            value: mongodb://social-graph-mongodb.socialnetwork-db.svc.cluster.local:27017/
          - name: HOME_REDIS
            value: home-timeline-redis.socialnetwork-db.svc.cluster.local
