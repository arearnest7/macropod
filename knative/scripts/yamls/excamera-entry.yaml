apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: excamera-entry
  namespace: knative-functions
spec:
  template:
    spec:
      containers:
        - image: docker.io/arearnest7/excamera-entry:kn
          env:
          - name: EXCAMERA_VPXENC
            value: http://excamera-vpxenc.knative-functions.127.0.0.1.sslip.io
          - name: EXCAMERA_VX_CON
            value: http://excamera-vx-con.knative-functions.127.0.0.1.sslip.io
