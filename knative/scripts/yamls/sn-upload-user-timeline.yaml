apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sn-upload-user-timeline
  namespace: knative-functions
spec:
  template:
    spec:
      containers:
        - image: docker.io/arearnest7/sn-upload-user-timeline:kn
          env:
          - name: USER_TIMELINE_URL
            value: mongodb://user-timeline-mongodb.socialnetwork-db.svc.cluster.local:27017/
          - name: USER_REDIS
            value: user-timeline-redis.socialnetwork-db.svc.cluster.local
